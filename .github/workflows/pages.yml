name: Build and deploy website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pdf.txt
      - name: Prepare selected CV
        run: |
          pip install -r requirements-pdf.txt
          python scripts/test_cv_selection.py
          python scripts/prepare_cv.py
      - name: Check whether Pages is configured
        id: pages-check
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages(context.repo);
              const enabled = data.build_type === 'workflow';
              core.setOutput('enabled', String(enabled));
              if (!enabled) core.notice('Select GitHub Actions in Settings → Pages to enable deployment.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', 'false');
              core.notice('Pages is not configured. The website will be built and checked without deployment.');
            }
      - name: Read Pages destination
        id: pages
        uses: actions/configure-pages@v5
        if: steps.pages-check.outputs.enabled == 'true'
      - name: Build website
        env:
          JEKYLL_ENV: production
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASEURL: ${{ steps.pages.outputs.base_path }}
        run: |
          ruby -rjson -e 'File.write("/tmp/pages.yml", {"url" => ENV.fetch("SITE_URL", ""), "baseurl" => ENV.fetch("SITE_BASEURL", "")}.to_json)'
          bundle exec jekyll build --strict_front_matter --config _config.yml,/tmp/pages.yml
          python scripts/check_site.py _site --baseurl "$SITE_BASEURL"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
