title: Rahil Ehtesham Mehr
description: "Physics undergraduate at Sharif University of Technology researching thin films and two-dimensional materials in experimental condensed matter physics."
locale: en-US
timezone: Asia/Tehran
url: ""
baseurl: ""
# GitHub Pages supplies url and baseurl when publishing.
# Edit personal details in _data/profile.json.
layouts_dir: _theme/layouts
includes_dir: _theme/includes

# PDF selection and the shared download URL live in _data/cv_pdf.json.
markdown: kramdown
highlighter: rouge
permalink: /:title/
include: [_pages]
collections:
  projects:
    output: true
    permalink: /research/:path/
defaults:
  - scope:
      path: ""
    values:
      layout: single
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      nav: research
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      nav: beyond
      permalink: /beyond-physics/:title/
plugins:
  - jekyll-sitemap
sass:
  sass_dir: _theme/styles
  style: compressed
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
exclude:
  - .cache
  - .bundle
  - .github
  - .impeccable
  - .agents
  - .codex
  - vendor
  - node_modules
  - prototypes
  - research
  - review
  - docs
  - _theme
  - cv-source
  - scripts
  - tmp
  - main.tex
  - PRODUCT.md
  - DESIGN.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - requirements-pdf.txt
  - _site-subpath
